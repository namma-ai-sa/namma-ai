<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌱 NAMMA AI V2</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:#16396b;
padding:20px;
color:white;
}

.container{
max-width:1200px;
margin:auto;
}

.logo{
text-align:center;
font-size:50px;
font-weight:bold;
margin-bottom:10px;
}

.subtitle{
text-align:center;
margin-bottom:25px;
font-size:20px;
}

textarea,
select,
input{
width:100%;
padding:15px;
border:none;
border-radius:12px;
margin-bottom:15px;
font-size:18px;
}

button{
width:100%;
padding:18px;
border:none;
border-radius:12px;
background:#4ade80;
color:white;
font-size:22px;
font-weight:bold;
cursor:pointer;
}

.results-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
gap:20px;
margin-top:25px;
}

.card{
background:#1b2b4a;
border-radius:20px;
padding:20px;
white-space:pre-wrap;
line-height:1.8;
min-height:180px;
}

.card h2{
margin-bottom:15px;
color:#7ef29b;
}

</style>
</head>

<body>

<div class="container">

<div class="logo">
🌱 NAMMA AI
</div>

<div class="subtitle">
نسخة V2 - البطاقات المستقلة
</div>

<select>

<option>
📝 إنشاء محتوى
</option>

<option>
🔍 فحص المشروع
</option>

</select>

<textarea
placeholder="اكتب الموضوع هنا">
</textarea>

<button>
🚀 تنفيذ
</button>

<div class="results-grid">

<div class="card">
<h2>📝 المقال</h2>
<div id="articleResult">
سيظهر المقال هنا
</div>
</div>

<div class="card">
<h2>🔍 SEO</h2>
<div id="seoResult">
ستظهر نتائج SEO هنا
</div>
</div>

<div class="card">
<h2>📱 السوشال</h2>
<div id="socialResult">
سيظهر محتوى السوشال هنا
</div>
</div>

<div class="card">
<h2>🎥 الفيديو</h2>
<div id="videoResult">
سيظهر محتوى الفيديو هنا
</div>
</div>

<div class="card">
<h2>🎨 الصورة</h2>
<div id="imageResult">
ستظهر أفكار الصور هنا
</div>
</div>

<div class="card">
<h2>📊 الخطة</h2>
<div id="planResult">
ستظهر خطة المحتوى هنا
</div>
</div>

</div>

</div>

</body>
</html>
