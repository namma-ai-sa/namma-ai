<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌱 NAMMA AI V5</title>

<style>

body{
background:#16396b;
font-family:Tahoma,sans-serif;
color:white;
padding:30px;
}

.container{
max-width:700px;
margin:auto;
}

.card{
background:#1b2b4a;
padding:20px;
border-radius:20px;
margin-bottom:20px;
}

input{
width:100%;
padding:15px;
margin-bottom:10px;
border:none;
border-radius:10px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:10px;
background:#22c55e;
color:white;
font-size:18px;
cursor:pointer;
}

.project-btn{
margin-bottom:10px;
background:#22385d;
}

</style>

</head>

<body>

<div id="loginScreen" class="container">

<div class="card">

<h1>🌱 NAMMA AI</h1>

<input
id="username"
placeholder="اسم المستخدم">

<input
id="password"
type="password"
placeholder="كلمة المرور">

<button onclick="login()">
تسجيل الدخول
</button>

</div>

</div>

<div
id="appScreen"
class="container"
style="display:none;">

<div class="card">

<h2 id="welcomeUser">
مرحباً
</h2>

<button onclick="logout()">
تسجيل الخروج
</button>

</div>

<div class="card">

<h3>📁 مشاريعي</h3>

<div id="projectsList">
</div>

</div>

</div>

<script>

let currentUser = null;

async function login(){

const username =
document.getElementById("username").value;

const password =
document.getElementById("password").value;

const response =
await fetch("/api/login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
username,
password
})
});

const data =
await response.json();

if(!data.success){

alert(data.message);

return;

}

currentUser =
data.user;

localStorage.setItem(
"user",
JSON.stringify(data.user)
);

document.getElementById(
"loginScreen"
).style.display =
"none";

document.getElementById(
"appScreen"
).style.display =
"block";

document.getElementById(
"welcomeUser"
).innerText =
"👋 مرحباً " +
data.user.name;

loadProjects();

}

async function loadProjects(){

const response =
await fetch(
`/api/projects?username=${currentUser.username}`
);

const data =
await response.json();

const list =
document.getElementById(
"projectsList"
);

list.innerHTML = "";

data.projects.forEach(project=>{

const btn =
document.createElement(
"button"
);

btn.className =
"project-btn";

btn.innerText =
project.name;

btn.onclick = async () => {

  const response =
    await fetch(
      `/api/project?username=${currentUser.username}&name=${encodeURIComponent(project.name)}`
    );

  const data =
    await response.json();

  const p =
    data.project;

  alert(
`📁 ${p.name}

📊 الحالة:
${p.status}

📈 نسبة الإنجاز:
${p.progress}%

✅ آخر مهمة:
${p.lastTask}

🚀 المهمة القادمة:
${p.nextTask}`
  );

};

list.appendChild(btn);

});

}

function logout(){

localStorage.removeItem(
"user"
);

location.reload();

}

window.onload=()=>{

const saved =
localStorage.getItem(
"user"
);

if(saved){

currentUser =
JSON.parse(saved);

document.getElementById(
"loginScreen"
).style.display =
"none";

document.getElementById(
"appScreen"
).style.display =
"block";

document.getElementById(
"welcomeUser"
).innerText =
"👋 مرحباً " +
currentUser.name;

loadProjects();

}

};

</script>

</body>
</html>
