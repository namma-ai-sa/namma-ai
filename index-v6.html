<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌱 نمّى Ai</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:#0f172a;
color:#fff;
height:100vh;
display:flex;
overflow:hidden;
}

.sidebar{
width:280px;
background:#16213e;
padding:20px;
overflow-y:auto;
border-left:1px solid rgba(255,255,255,.1);
}

.logo{
font-size:28px;
font-weight:bold;
text-align:center;
margin-bottom:20px;
}

.new-chat{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#22c55e;
color:white;
font-size:16px;
cursor:pointer;
margin-bottom:20px;
}

.menu-item{
background:#1e293b;
padding:12px;
border-radius:12px;
margin-bottom:10px;
cursor:pointer;
}

.main{
flex:1;
display:flex;
flex-direction:column;
}

.header{
padding:20px;
border-bottom:1px solid rgba(255,255,255,.1);
}

.chat-container{
flex:1;
padding:20px;
overflow-y:auto;
}

.message{
padding:15px;
border-radius:15px;
margin-bottom:15px;
max-width:85%;
white-space:pre-wrap;
line-height:1.8;
}

.user{
background:#22c55e;
margin-right:auto;
}

.ai{
background:#1e293b;
margin-left:auto;
}

.input-area{
padding:15px;
background:#111827;
display:flex;
gap:10px;
}

textarea{
flex:1;
height:70px;
border:none;
border-radius:12px;
padding:15px;
font-size:16px;
resize:none;
}

.btn{
border:none;
border-radius:12px;
padding:15px;
font-size:18px;
cursor:pointer;
background:#22c55e;
color:white;
min-width:70px;
}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">
🌱 نمّى Ai
</div>

<button
class="new-chat"
onclick="newChat()">

➕ محادثة جديدة

</button>

<div class="menu-item">
🧠 محادثة التسويق
</div>

<div class="menu-item">
🧠 نبض التقنية
</div>

<div class="menu-item">
🧠 إدراك
</div>

<hr style="margin:20px 0;opacity:.2;">

<div class="menu-item">
📁 مشاريعي
</div>

<div class="menu-item">
👑 حسابي
</div>

<div class="menu-item">
⚙️ الإعدادات
</div>

</div>

<div class="main">

<div class="header">

<h2>
🌱 نمّى Ai
</h2>

<p>
كيف يمكنني مساعدتك اليوم؟
</p>

</div>

<div
id="chatContainer"
class="chat-container">

<div class="message ai">

مرحباً 👋

أنا نمّى Ai.

جاهز لمساعدتك.

</div>

</div>

<div class="input-area">

<button
class="btn"
onclick="startVoiceInput()">

🎤

</button>

<textarea
id="prompt"
placeholder="اكتب رسالتك هنا..."
onkeydown="handleEnter(event)">
</textarea>

<button
class="btn"
onclick="sendMessage()">

➤

</button>

</div>

</div>

<script>

function handleEnter(event){

if(
event.key === "Enter" &&
!event.shiftKey
){

event.preventDefault();

sendMessage();

}

}

async function sendMessage(){

const prompt =
document.getElementById(
"prompt"
).value.trim();

if(!prompt) return;

const chat =
document.getElementById(
"chatContainer"
);

chat.innerHTML +=
`<div class="message user">${prompt}</div>`;

document.getElementById(
"prompt"
).value = "";

chat.innerHTML +=
`<div id="loading" class="message ai">⏳ جاري التفكير...</div>`;

chat.scrollTop =
chat.scrollHeight;

try{

const response =
await fetch(
`/api/article?topic=${encodeURIComponent(prompt)}`
);

const data =
await response.json();

const loading =
document.getElementById(
"loading"
);

if(loading){
loading.remove();
}

chat.innerHTML +=
`<div class="message ai">${data.result}</div>`;

speakText(
data.result
);

chat.scrollTop =
chat.scrollHeight;

}catch(error){

const loading =
document.getElementById(
"loading"
);

if(loading){
loading.innerText =
error.message;
}

}

}

function newChat(){

document.getElementById(
"chatContainer"
).innerHTML =
`
<div class="message ai">
مرحباً 👋

أنا نمّى Ai.

كيف يمكنني مساعدتك اليوم؟
</div>
`;

}

function startVoiceInput(){

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

alert(
"التعرف الصوتي غير مدعوم"
);

return;

}

const recognition =
new SpeechRecognition();

recognition.lang =
"ar-SA";

recognition.start();

recognition.onresult =
(event)=>{

document.getElementById(
"prompt"
).value =
event.results[0][0].transcript;

};

}

function speakText(text){

speechSynthesis.cancel();

const speech =
new SpeechSynthesisUtterance(
text
);

speech.lang =
"ar-SA";

speech.rate = 1;

speechSynthesis.speak(
speech
);

}

</script>

</body>
</html>
