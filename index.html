<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نمّى AI</title>

<style>
body{
background:#0f3460;
color:white;
font-family:Tahoma;
padding:20px;
text-align:center;
}

button{
padding:15px 25px;
font-size:20px;
background:#4ade80;
border:none;
border-radius:10px;
color:white;
}

.card{
background:#1e293b;
padding:20px;
margin-top:20px;
border-radius:15px;
}
</style>

<script>
function generateContent(){

let userInput =
document.querySelector("textarea").value;

document.getElementById("result").innerText =
`
🌱 نمّى AI

📝 مقال

${userInput} من المواضيع المهمة التي يمكن تطويرها وتحويلها إلى مشروع أو محتوى ناجح.

🔍 SEO

- أفضل ${userInput}
- دليل ${userInput}
- أفكار ${userInput}
- تطوير ${userInput}

📱 منشور X

اكتشف كيف يمكن لـ ${userInput} أن تساعدك على تحقيق نتائج أفضل 🚀

🎥 فكرة فيديو

5 أفكار مبتكرة للاستفادة من ${userInput}

🎨 فكرة صورة

تصميم احترافي يعبر عن ${userInput} بأسلوب عصري وحديث.

📊 خطة عمل

1- تحديد الهدف
2- دراسة السوق
3- التنفيذ
4- قياس النتائج
5- التطوير

✅ تم إنشاء المحتوى بنجاح
`;
}
</script>

</head>
<body>

<h1>🌱 نمّى AI</h1>

<p>فكرتك... إلى محتوى جاهز</p>

<textarea style="width:100%;height:120px;"></textarea>

<br><br>

<button onclick="generateContent()">
🚀 توليد المحتوى
</button>

<div class="card">
<p id="result">
النتيجة ستظهر هنا
</p>
</div>

</body>
</html>
