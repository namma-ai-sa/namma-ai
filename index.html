<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌱 نمّى AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:#16396b;
color:white;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
}

.logo{
text-align:center;
font-size:60px;
font-weight:bold;
margin-top:20px;
}

.subtitle{
text-align:center;
font-size:28px;
margin-top:20px;
margin-bottom:40px;
}

select{
width:100%;
padding:15px;
font-size:18px;
border:none;
border-radius:15px;
margin-bottom:15px;
}

textarea{
width:100%;
height:180px;
padding:20px;
border:none;
border-radius:20px;
font-size:20px;
resize:none;
color:#111;
}

button{
display:block;
margin:30px auto;
padding:20px 50px;
font-size:28px;
font-weight:bold;
background:#55dd82;
color:white;
border:none;
border-radius:20px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.grid{
display:grid;
gap:20px;
margin-top:30px;
}

.card{
background:#1b2b4a;
padding:25px;
border-radius:20px;
line-height:2;
white-space:pre-wrap;
word-wrap:break-word;
}

.card h2{
margin-bottom:15px;
color:#7ef29b;
}

.copy-btn{
margin-top:15px;
padding:10px 20px;
font-size:16px;
border:none;
border-radius:10px;
background:#4ade80;
color:white;
cursor:pointer;
}

</style>

<script>

async function generateContent(){

let userInput =
document.querySelector("textarea").value;

let contentType =
document.getElementById("contentType").value;

if(!userInput){

alert("اكتب طلبك أولاً");

return;

}

document.getElementById("result").innerText =
"⏳ نمّى AI يفكر الآن...";

try{

let response = await fetch(
`/api/generate?topic=${encodeURIComponent(userInput)}&type=${contentType}`
);

let data = await response.json();

document.getElementById("result").innerText =
data.article;

}catch(error){

document.getElementById("result").innerText =
"❌ حدث خطأ أثناء إنشاء المحتوى";

}

}

function copyText(){

let text =
document.getElementById("result").innerText;

navigator.clipboard.writeText(text);

alert("✅ تم النسخ");

}

</script>

</head>

<body>

<div class="container">

<div class="logo">
🌱 نمّى AI
</div>

<div class="subtitle">
فكرتك... إلى محتوى جاهز
</div>

<select id="contentType">

<option value="all">📦 الكل</option>

<option value="article">📝 مقال</option>

<option value="seo">🔍 SEO</option>

<option value="social">📱 منشور X</option>

<option value="youtube">🎥 يوتيوب</option>

<option value="image">🎨 صورة</option>

<option value="plan">📊 خطة محتوى</option>

</select>

<textarea placeholder="اكتب طلبك هنا...

مثال:
نبض التقنية
العطور
التسويق
الأمن السيبراني"></textarea>

<button onclick="generateContent()">
🚀 توليد المحتوى
</button>

<div class="grid">

<div class="card">

<h2>📄 النتيجة</h2>

<div id="result">
ستظهر النتيجة هنا
</div>

<button class="copy-btn" onclick="copyText()">
📋 نسخ
</button>

</div>

</div>

</div>

</body>

</html>
