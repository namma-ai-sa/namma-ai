<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌱 نمّى AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:linear-gradient(180deg,#16213e,#0f3460);
min-height:100vh;
padding:20px;
color:white;
}

.container{
max-width:900px;
margin:auto;
text-align:center;
}

.logo{
font-size:55px;
font-weight:bold;
color:#7ee787;
text-shadow:0 0 30px rgba(126,231,135,.8);
margin-top:20px;
}

.subtitle{
font-size:24px;
margin-top:15px;
margin-bottom:25px;
color:#e5e7eb;
text-shadow:0 0 15px rgba(255,255,255,.3);
}

textarea{
width:100%;
height:120px;
padding:18px;
font-size:18px;
border:none;
border-radius:20px;
outline:none;
color:#111827;
font-weight:bold;
}

textarea::placeholder{
color:#6b7280;
}

button{
margin-top:25px;
padding:18px 40px;
font-size:22px;
font-weight:bold;
background:#4ade80;
color:white;
border:none;
border-radius:18px;
cursor:pointer;
box-shadow:0 0 20px rgba(74,222,128,.5);
}

.results{
margin-top:40px;
display:grid;
gap:20px;
}

.card{
background:#1e293b;
padding:25px;
border-radius:20px;
box-shadow:0 0 15px rgba(0,0,0,.3);
text-align:right;
}

.card h3{
color:#7ee787;
margin-bottom:15px;
font-size:28px;
}

.card p{
font-size:18px;
line-height:1.8;
color:#e2e8f0;
}

</style>
</head>

<body>

<div class="container">

<div class="logo">
🌱 نمّى AI
</div>

<div class="subtitle">
فكرتك... إلى محتوى جاهز
</div>

<textarea placeholder="اكتب طلبك هنا...
