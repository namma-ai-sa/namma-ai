<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نمّى AI</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:linear-gradient(180deg,#16213e,#0f3460);
min-height:100vh;
padding:20px;
color:white;
}

.container{
max-width:900px;
margin:auto;
text-align:center;
}

.logo{
font-size:55px;
font-weight:bold;
color:#7ee787;
text-shadow:0 0 30px rgba(126,231,135,.8);
margin-top:20px;
}

.subtitle{
font-size:24px;
margin-top:15px;
margin-bottom:25px;
color:#e5e7eb;
}

textarea{
width:100%;
height:120px;
padding:18px;
font-size:18px;
border:none;
border-radius:20px;
outline:none;
color:#111827;
}

button{
margin-top:20px;
padding:18px 40px;
font-size:22px;
background:#4ade80;
color:white;
border:none;
border-radius:18px;
cursor:pointer;
}

.results{
margin-top:40px;
display:grid;
gap:20px;
}

.card{
background:#1e293b;
padding:25px;
border-radius:20px;
text-align:right;
}

.card h3{
color:#7ee787;
margin-bottom:10px;
}

.card p{
color:#e2e8f0;
line-height:1.8;
}
</style>

</head>

<body>

<div class="container">

<div class="logo">🌱 نمّى AI</div>

<div class="subtitle">
فكرتك... إلى محتوى جاهز
</div>

<textarea placeholder="اكتب طلبك هنا..."></textarea>

<br>

<button onclick="generateContent()">
🚀 توليد المحتوى
</button>

<div class="results">

<div class="card">
<h3>📝 المقال</h3>
<p id="articleResult">سيظهر هنا المحتوى المولد.</p>
</div>

<div class="card">
<h3>🔍 SEO</h3>
<p id="seoResult">سيظهر هنا السيو والكلمات المفتاحية.</p>
</div>

<div class="card">
<h3>📱 التواصل الاجتماعي</h3>
<p id="socialResult">X - Facebook - LinkedIn</p>
</div>

<div class="card">
<h3>🎥 الفيديو</h3>
<p id="videoResult">سكربت الفيديو والتعليق الصوتي.</p>
</div>

<div class="card">
<h3>🎨 الصور</h3>
<p id="imageResult">أفكار وبرومبتات الصور.</p>
</div>

</div>

</div>

script.jsscript>

</body>
</html>
