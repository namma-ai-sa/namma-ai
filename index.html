<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌱 نمّى AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:#16396b;
color:white;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
}

.logo{
text-align:center;
font-size:60px;
font-weight:bold;
margin-top:20px;
}

.subtitle{
text-align:center;
font-size:28px;
margin-top:20px;
margin-bottom:40px;
}

textarea{
width:100%;
height:180px;
padding:20px;
border:none;
border-radius:20px;
font-size:20px;
resize:none;
color:#111;
}

button{
display:block;
margin:30px auto;
padding:20px 50px;
font-size:28px;
font-weight:bold;
background:#55dd82;
color:white;
border:none;
border-radius:20px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.grid{
display:grid;
gap:20px;
margin-top:30px;
}

.card{
background:#1b2b4a;
padding:25px;
border-radius:20px;
line-height:2;
white-space:pre-wrap;
word-wrap:break-word;
}

.card h2{
margin-bottom:15px;
color:#7ef29b;
}

.copy-btn{
margin-top:15px;
padding:10px 20px;
font-size:16px;
border:none;
border-radius:10px;
background:#4ade80;
color:white;
cursor:pointer;
}

</style>

<script>

async function generateContent(){

let userInput =
document.querySelector("textarea").value;

if(!userInput){

alert("اكتب طلبك أولاً");

return;

}

document.getElementById("article").innerText =
"⏳ نمّى AI يفكر الآن...";

document.getElementById("seo").innerText =
"⏳";

document.getElementById("social").innerText =
"⏳";

document.getElementById("video").innerText =
"⏳";

document.getElementById("image").innerText =
"⏳";

try{

let response = await fetch(
`/api/generate?topic=${encodeURIComponent(userInput)}`
);

let data = await response.json();

document.getElementById("article").innerText =
data.article;

document.getElementById("seo").innerText =
"✅ موجود داخل المحتوى";

document.getElementById("social").innerText =
"✅ موجود داخل المحتوى";

document.getElementById("video").innerText =
"✅ موجود داخل المحتوى";

document.getElementById("image").innerText =
"✅ موجود داخل المحتوى";

}catch(error){

document.getElementById("article").innerText =
"❌ حدث خطأ أثناء إنشاء المحتوى";

}

}

function copyText(id){

let text =
document.getElementById(id).innerText;

navigator.clipboard.writeText(text);

alert("✅ تم النسخ");

}

</script>

</head>

<body>

<div class="container">

<div class="logo">
🌱 نمّى AI
</div>

<div class="subtitle">
فكرتك... إلى محتوى جاهز
</div>

<textarea placeholder="اكتب طلبك هنا...

مثال:
اكتب مقال لمدونة نبض التقنية
أنشئ حملة تسويقية لعطر
أنشئ خطة محتوى لمتجر إلكتروني"></textarea>

<button onclick="generateContent()">
🚀 توليد المحتوى
</button>

<div class="grid">

<div class="card">
<h2>📝 المقال</h2>
<div id="article">
سيظهر المقال هنا
</div>
<button class="copy-btn" onclick="copyText('article')">
📋 نسخ
</button>
</div>

<div class="card">
<h2>🔍 SEO</h2>
<div id="seo">
سيظهر محتوى SEO هنا
</div>
<button class="copy-btn" onclick="copyText('seo')">
📋 نسخ
</button>
</div>

<div class="card">
<h2>📱 منشور X</h2>
<div id="social">
سيظهر المنشور هنا
</div>
<button class="copy-btn" onclick="copyText('social')">
📋 نسخ
</button>
</div>

<div class="card">
<h2>🎥 فكرة فيديو</h2>
<div id="video">
ستظهر فكرة الفيديو هنا
</div>
<button class="copy-btn" onclick="copyText('video')">
📋 نسخ
</button>
</div>

<div class="card">
<h2>🎨 فكرة صورة</h2>
<div id="image">
ستظهر فكرة الصورة هنا
</div>
<button class="copy-btn" onclick="copyText('image')">
📋 نسخ
</button>
</div>

</div>

</div>

</body>
</html>
