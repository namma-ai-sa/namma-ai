<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نمّى AI</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(
180deg,
#16213e,
#0f3460
);

color:white;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
text-align:center;
}

.logo{
font-size:42px;
font-weight:bold;
color:#22c55e;
margin-top:30px;
}

.subtitle{
font-size:20px;
margin-top:10px;
color:#cbd5e1;
}

textarea{
width:100%;
height:100px;

margin-top:30px;
padding:15px;
border:none;
border-radius:15px;
font-size:16px;
}

button{
margin-top:20px;
background:#22c55e;
color:white;
border:none;
padding:15px 30px;
font-size:18px;
border-radius:12px;
cursor:pointer;
}

.results{
margin-top:40px;
display:grid;
gap:15px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:15px;
text-align:right;
}

.card h3{
margin-bottom:10px;
color:#22c55e;
}
</style>
</head>
<body>

<div class="container">

<div class="logo">🌱 نمّى AI</div>

<div class="subtitle">
فكرتك... إلى محتوى جاهز
</div>

<textarea placeholder="اكتب أي شيء...

مثال:
أنشئ حملة تسويقية لعطر فاخر
أو
اكتب مقال عن Microsoft Copilot"></textarea>

<br>

<button>🚀 توليد المحتوى</button>

<div class="results">

<div class="card">
<h3>📝 المقال</h3>
<p>سيظهر هنا المقال المولد.</p>
</div>

<div class="card">
<h3>🔍 SEO</h3>
<p>سيظهر هنا وصف وتحسينات محركات البحث.</p>
</div>

<div class="card">
<h3>📱 منشورات التواصل</h3>
<p>X • فيسبوك • لينكدإن</p>
</div>

<div class="card">
<h3>🎥 الفيديو</h3>
<p>سكربت الفيديو والمشاهد.</p>
</div>

<div class="card">
<h3>🎨 الصور</h3>
<p>برومبتات إنشاء الصور.</p>
</div>

</div>

</div>

</body>
</html>
