<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌱 نمّى AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:#16396b;
color:white;
padding:20px;
}

.container{
max-width:1000px;
margin:auto;
}

.logo{
text-align:center;
font-size:60px;
font-weight:bold;
margin-top:20px;
}

.subtitle{
text-align:center;
font-size:24px;
margin-top:15px;
margin-bottom:30px;
}

select,
input,
textarea{
width:100%;
padding:15px;
border:none;
border-radius:15px;
font-size:18px;
margin-bottom:15px;
}

textarea{
height:180px;
resize:none;
}

button{
width:100%;
padding:18px;
background:#4ade80;
color:white;
border:none;
border-radius:15px;
font-size:22px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.card{
background:#1b2b4a;
padding:25px;
border-radius:20px;
margin-top:25px;
line-height:2;
white-space:pre-wrap;
word-wrap:break-word;
}

.title{
font-size:24px;
font-weight:bold;
margin-bottom:15px;
color:#7ef29b;
}

.copy-btn{
margin-top:15px;
background:#22c55e;
font-size:16px;
padding:10px;
}

</style>

<script>

function changeMode(){

let mode =
document.getElementById("mode").value;

let contentBox =
document.getElementById("contentArea");

let analyzeBox =
document.getElementById("analyzeArea");

if(mode === "analyze"){

contentBox.style.display = "none";
analyzeBox.style.display = "block";

}else{

contentBox.style.display = "block";
analyzeBox.style.display = "none";

}

}

async function runAction(){

let mode =
document.getElementById("mode").value;

let result =
document.getElementById("result");

result.innerText =
"⏳ جاري التنفيذ...";

try{

if(mode === "analyze"){

let url =
document.getElementById("websiteUrl").value;

if(!url){

alert("أدخل رابط الموقع");

return;

}

let response =
await fetch(
`/api/analyze?url=${encodeURIComponent(url)}`
);

let data =
await response.json();

result.innerText =
data.result;

}else{

let topic =
document.getElementById("topic").value;

let type =
document.getElementById("contentType").value;

if(!topic){

alert("اكتب موضوعاً أولاً");

return;

}

let response =
await fetch(
`/api/generate?topic=${encodeURIComponent(topic)}&type=${type}`
);

let data =
await response.json();

result.innerText =
data.article;

}

}catch(error){

result.innerText =
"❌ حدث خطأ أثناء التنفيذ";

}

}

function copyResult(){

let text =
document.getElementById("result").innerText;

navigator.clipboard.writeText(text);

alert("✅ تم النسخ");

}

</script>

</head>

<body>

<div class="container">

<div class="logo">
🌱 نمّى AI
</div>

<div class="subtitle">
مساعد المحتوى الذكي
</div>

<select id="mode" onchange="changeMode()">

<option value="content">
📝 إنشاء محتوى
</option>

<option value="analyze">
🔍 تحليل موقع
</option>

</select>

<div id="contentArea">

<select id="contentType">

<option value="all">
📦 الكل
</option>

<option value="article">
📝 مقال
</option>

<option value="seo">
🔍 SEO
</option>

<option value="social">
📱 سوشال ميديا
</option>

<option value="video">
🎥 فيديو
</option>

<option value="image">
🎨 صورة
</option>

<option value="plan">
📊 خطة محتوى
</option>

<option value="analysis-content">
🚀 محتوى من التحليل
</option>

</select>

<textarea
id="topic"
placeholder="اكتب الموضوع هنا...

مثال:
نبض التقنية
متجر عطور
شركة تسويق
ذكاء اصطناعي"></textarea>

</div>

<div
id="analyzeArea"
style="display:none;">

<input
id="websiteUrl"
type="text"
placeholder="https://example.com">

</div>

<button onclick="runAction()">
🚀 تنفيذ
</button>

<div class="card">

<div class="title">
📄 النتيجة
</div>

<div id="result">
ستظهر النتيجة هنا
</div>

<button
class="copy-btn"
onclick="copyResult()">
📋 نسخ النتيجة
</button>

</div>

</div>

</body>

</html>
