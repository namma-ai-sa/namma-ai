<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌱 نمّى AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:#16396b;
color:white;
padding:20px;
}

.container{
max-width:950px;
margin:auto;
}

.logo{
text-align:center;
font-size:60px;
font-weight:bold;
margin-top:20px;
}

.subtitle{
text-align:center;
font-size:25px;
margin-top:15px;
margin-bottom:30px;
}

select,
input,
textarea{
width:100%;
padding:15px;
font-size:18px;
border:none;
border-radius:15px;
margin-bottom:15px;
}

textarea{
height:160px;
resize:none;
}

button{
width:100%;
padding:18px;
font-size:22px;
font-weight:bold;
background:#55dd82;
color:white;
border:none;
border-radius:15px;
cursor:pointer;
margin-bottom:15px;
}

.card{
background:#1b2b4a;
padding:25px;
border-radius:20px;
margin-top:20px;
white-space:pre-wrap;
line-height:2;
}

.title{
color:#7ef29b;
margin-bottom:15px;
font-size:24px;
}

.copy-btn{
margin-top:15px;
background:#4ade80;
font-size:16px;
padding:10px;
}

</style>

<script>

async function runAction(){

const mode =
document.getElementById("mode").value;

const result =
document.getElementById("result");

result.innerText =
"⏳ جاري التنفيذ...";

try{

if(mode === "analyze"){

const url =
document.getElementById("websiteUrl").value;

if(!url){

alert("أدخل رابط الموقع");

return;

}

let response = await fetch(
`/api/analyze?url=${encodeURIComponent(url)}`
);

let data = await response.json();

result.innerText =
data.result;

}else{

const topic =
document.getElementById("topic").value;

if(!topic){

alert("اكتب الموضوع");

return;

}

const type =
document.getElementById("contentType").value;

let response = await fetch(
`/api/generate?topic=${encodeURIComponent(topic)}&type=${type}`
);

let data = await response.json();

result.innerText =
data.article;

}

}catch(error){

result.innerText =
"❌ حدث خطأ";

}

}

function copyResult(){

const text =
document.getElementById("result").innerText;

navigator.clipboard.writeText(text);

alert("✅ تم النسخ");

}

function changeMode(){

const mode =
document.getElementById("mode").value;

const contentArea =
document.getElementById("contentArea");

const analyzeArea =
document.getElementById("analyzeArea");

if(mode === "analyze"){

contentArea.style.display = "none";
analyzeArea.style.display = "block";

}else{

contentArea.style.display = "block";
analyzeArea.style.display = "none";

}

}

</script>

</head>

<body>

<div class="container">

<div class="logo">
🌱 نمّى AI
</div>

<div class="subtitle">
كاتب محتوى + مخطط محتوى + محلل مواقع
</div>

<select id="mode" onchange="changeMode()">

<option value="content">
📝 إنشاء محتوى
</option>

<option value="analyze">
🔍 تحليل موقع
</option>

</select>

<div id="contentArea">

<select id="contentType">

<option value="all">📦 الكل</option>

<option value="article">📝 مقال</option>

<option value="seo">🔍 SEO</option>

<option value="social">📱 سوشال ميديا</option>

<option value="video">🎥 فيديو</option>

<option value="image">🎨 صورة</option>

<option value="plan">📊 خطة محتوى</option>

</select>

<textarea
id="topic"
placeholder="اكتب الموضوع هنا..."></textarea>

</div>

<div
id="analyzeArea"
style="display:none;">

<input
id="websiteUrl"
type="text"
placeholder="https://example.com">

</div>

<button onclick="runAction()">
🚀 تنفيذ
</button>

<div class="card">

<div class="title">
📄 النتيجة
</div>

<div id="result">
ستظهر النتيجة هنا
</div>

<button
class="copy-btn"
onclick="copyResult()">
📋 نسخ
</button>

</div>

</div>

</body>

</html>
