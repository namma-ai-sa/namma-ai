<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌱 NAMMA AI V5</title>

<style>

body{
background:#16396b;
font-family:Tahoma,sans-serif;
color:white;
padding:30px;
}

.container{
max-width:700px;
margin:auto;
}

.card{
background:#1b2b4a;
padding:20px;
border-radius:20px;
margin-bottom:20px;
}

input{
width:100%;
padding:15px;
margin-bottom:10px;
border:none;
border-radius:10px;
}
textarea{
width:100%;
padding:15px;
border:none;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:10px;
background:#22c55e;
color:white;
font-size:18px;
cursor:pointer;
margin-bottom:10px;
}

.project-btn{
background:#22385d;
}

</style>

</head>

<body>

<div id="loginScreen" class="container">

<div class="card">

<h1>🌱 NAMMA AI</h1>

<input
id="username"
placeholder="اسم المستخدم">

<input
id="password"
type="password"
placeholder="كلمة المرور">
<label style="display:block;margin:10px 0;">

<input
type="checkbox"
id="rememberMe"
style="width:auto;">

تذكرني

</label>

<button onclick="login()">
تسجيل الدخول
</button>

<button onclick="showRegister()">
إنشاء حساب جديد
</button>

</div>

</div>

<div
id="registerScreen"
class="container"
style="display:none;">

<div class="card">

<h2>إنشاء حساب جديد</h2>

<input
id="registerName"
placeholder="الاسم">

<input
id="registerUsername"
placeholder="اسم المستخدم">

<input
id="registerPassword"
type="password"
placeholder="كلمة المرور">

<button onclick="register()">
إنشاء الحساب
</button>

<button onclick="backToLogin()">
لدي حساب بالفعل
</button>

</div>

</div>

<div
id="appScreen"
class="container"
style="display:none;">

<div class="card">

<h2 id="welcomeUser">
مرحباً
</h2>

<button onclick="logout()">
تسجيل الخروج
</button>

</div>

<div class="card">

<h3>📁 مشاريعي</h3>

<div id="projectsList">
</div>

</div>

<div class="card">

<h3>🧠 ماذا تريد من NAMMA AI ؟</h3>

<textarea
id="aiPrompt"
placeholder="اكتب طلبك أو تحدث..."
style="
width:100%;
height:180px;
padding:15px;
border:none;
border-radius:10px;
margin-bottom:10px;
"></textarea>

<button onclick="startVoiceInput()">
🎤 التحدث
</button>

<button onclick="askAI()">
🚀 تنفيذ الطلب
</button>

<button onclick="stopVoice()">
🔇 إيقاف الصوت
</button>


</div>

<div class="card">

<h3>📄 النتيجة</h3>

<div id="aiResult">
اكتب طلبك ثم اضغط تنفيذ
</div>

</div>

</div>

<script>

let currentUser = null;

function showRegister(){

document.getElementById(
"loginScreen"
).style.display="none";

document.getElementById(
"registerScreen"
).style.display="block";

}

function backToLogin(){

document.getElementById(
"registerScreen"
).style.display="none";

document.getElementById(
"loginScreen"
).style.display="block";

}

async function register(){

const name =
document.getElementById(
"registerName"
).value;

const username =
document.getElementById(
"registerUsername"
).value;

const password =
document.getElementById(
"registerPassword"
).value;

const response =
await fetch(
"/api/register",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
name,
username,
password
})
}
);

const data =
await response.json();

if(!data.success){

alert(
JSON.stringify(data)
);

return;

}

alert(
"تم إنشاء الحساب بنجاح"
);

backToLogin();

}

async function login(){

const username =
document.getElementById("username").value;

const password =
document.getElementById("password").value;

const response =
await fetch("/api/login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
username,
password
})
});

const data =
await response.json();

if(!data.success){

alert(data.message);

return;

}

currentUser =
data.user;
if(
document.getElementById(
"rememberMe"
).checked
){

localStorage.setItem(
"rememberedUsername",
username
);

}else{

localStorage.removeItem(
"rememberedUsername"
);

}

localStorage.setItem(
"user",
JSON.stringify(data.user)
);

document.getElementById(
"loginScreen"
).style.display =
"none";

document.getElementById(
"appScreen"
).style.display =
"block";

document.getElementById(
"welcomeUser"
).innerText =
"👋 مرحباً " +
data.user.name;

loadProjects();

}

async function loadProjects(){

const response =
await fetch(
`/api/projects?username=${currentUser.username}`
);

const data =
await response.json();

const list =
document.getElementById(
"projectsList"
);

list.innerHTML = "";

data.projects.forEach(project=>{

const btn =
document.createElement(
"button"
);

btn.className =
"project-btn";

btn.innerText =
project.name;

btn.onclick = async () => {

const response =
await fetch(
`/api/project?username=${currentUser.username}&name=${encodeURIComponent(project.name)}`
);

const data =
await response.json();

const p =
data.project;

alert(
`📁 ${p.name}

📊 الحالة:
${p.status}

📈 نسبة الإنجاز:
${p.progress}%

✅ آخر مهمة:
${p.lastTask}

🚀 المهمة القادمة:
${p.nextTask}`
);

};

list.appendChild(btn);

});

}

function logout(){

localStorage.removeItem(
"user"
);

location.reload();

}
async function askAI(){

const prompt =
document.getElementById(
"aiPrompt"
).value;

if(!prompt){

alert(
"اكتب طلبك أولاً"
);

return;

}

document.getElementById(
"aiResult"
).innerText =
"⏳ جاري التنفيذ...";

try{

const response =
await fetch(
`/api/article?topic=${encodeURIComponent(prompt)}`
);

const data =
await response.json();

const resultText =
data.result ||
data.article ||
"لا توجد نتيجة";

document.getElementById(
"aiResult"
).innerText =
resultText;

speakText(
resultText
);

}
catch(error){

document.getElementById(
"aiResult"
).innerText =
error.message;

}

}
function startVoiceInput(){

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

alert(
"التعرف الصوتي غير مدعوم"
);

return;

}

const recognition =
new SpeechRecognition();

recognition.lang =
"ar-SA";

recognition.start();

recognition.onresult =
(event)=>{

document.getElementById(
"aiPrompt"
).value =
event.results[0][0].transcript;

};

}

function stopVoice(){

speechSynthesis.cancel();

}

function speakText(text){

speechSynthesis.cancel();

const speech =
new SpeechSynthesisUtterance(
text
);

speech.lang =
"ar-SA";

speech.rate = 1;

speech.pitch = 1;

speechSynthesis.speak(
speech
);

}

window.onload=()=>{
const remembered =
localStorage.getItem(
"rememberedUsername"
);

if(remembered){

document.getElementById(
"username"
).value =
remembered;

document.getElementById(
"rememberMe"
).checked =
true;

}

const saved =
localStorage.getItem(
"user"
);

if(saved){

currentUser =
JSON.parse(saved);

document.getElementById(
"loginScreen"
).style.display =
"none";

document.getElementById(
"appScreen"
).style.display =
"block";

document.getElementById(
"welcomeUser"
).innerText =
"👋 مرحباً " +
currentUser.name;

loadProjects();

}

};

</script>

</body>
</html>
